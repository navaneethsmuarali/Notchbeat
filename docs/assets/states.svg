<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0d16"/>
      <stop offset="1" stop-color="#07070b"/>
    </linearGradient>
    <linearGradient id="art" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff375f"/>
      <stop offset="1" stop-color="#5e5ce6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-50%" width="140%" height="220%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.8"/>
    </filter>
  </defs>
  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>

  <text x="640" y="60" font-size="13" font-weight="700" fill="#fff" fill-opacity="0.4" text-anchor="middle" letter-spacing="3">ALWAYS AT A GLANCE</text>
  <text x="640" y="96" font-size="28" font-weight="700" fill="#fff" text-anchor="middle">One island. Every moment that matters.</text>

  <!-- Now playing -->
  <g transform="translate(70,140)">
    <g filter="url(#shadow)"><rect width="260" height="48" rx="24" fill="#000" stroke="#fff" stroke-opacity="0.08"/></g>
    <rect x="10" y="9" width="30" height="30" rx="8" fill="url(#art)"/>
    <text x="50" y="30" font-size="13" font-weight="600" fill="#fff">Midnight Drive</text>
    <g fill="#ff375f"><rect x="216" y="18" width="4" height="14" rx="2"/><rect x="223" y="13" width="4" height="22" rx="2"/><rect x="230" y="20" width="4" height="10" rx="2"/><rect x="237" y="15" width="4" height="18" rx="2"/></g>
    <text x="130" y="96" font-size="15" font-weight="600" fill="#fff" text-anchor="middle">Now playing</text>
    <text x="130" y="120" font-size="12.5" fill="#fff" fill-opacity="0.5" text-anchor="middle">Artwork + live equalizer</text>
  </g>

  <!-- Meeting -->
  <g transform="translate(370,140)">
    <g filter="url(#shadow)"><rect width="260" height="48" rx="24" fill="#000" stroke="#fff" stroke-opacity="0.08"/></g>
    <text x="22" y="30" font-size="13" font-weight="600" fill="#fff">📅 Standup in 4 min</text>
    <rect x="186" y="11" width="60" height="26" rx="13" fill="#30d158"/>
    <text x="216" y="29" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">Join</text>
    <text x="130" y="96" font-size="15" font-weight="600" fill="#fff" text-anchor="middle">Meeting countdown</text>
    <text x="130" y="120" font-size="12.5" fill="#fff" fill-opacity="0.5" text-anchor="middle">Meet · Zoom · Teams · Webex</text>
  </g>

  <!-- Agent -->
  <g transform="translate(670,140)">
    <g filter="url(#shadow)"><rect width="260" height="48" rx="24" fill="#000" stroke="#fff" stroke-opacity="0.08"/></g>
    <circle cx="28" cy="24" r="6" fill="#ff9f0a"/>
    <circle cx="28" cy="24" r="11" fill="none" stroke="#ff9f0a" stroke-opacity="0.4" stroke-width="2"/>
    <text x="48" y="30" font-size="13" font-weight="600" fill="#fff">Claude Code needs approval</text>
    <text x="130" y="96" font-size="15" font-weight="600" fill="#fff" text-anchor="middle">AI agent alerts</text>
    <text x="130" y="120" font-size="12.5" fill="#fff" fill-opacity="0.5" text-anchor="middle">Claude Code &amp; Codex sessions</text>
  </g>

  <!-- AirPods -->
  <g transform="translate(970,140)">
    <g filter="url(#shadow)"><rect width="240" height="48" rx="24" fill="#000" stroke="#fff" stroke-opacity="0.08"/></g>
    <text x="22" y="30" font-size="13" font-weight="600" fill="#fff">🎧 AirPods Pro</text>
    <rect x="150" y="17" width="44" height="14" rx="4" fill="none" stroke="#fff" stroke-opacity="0.5"/>
    <rect x="152" y="19" width="32" height="10" rx="2" fill="#30d158"/>
    <text x="202" y="29" font-size="12" fill="#fff" fill-opacity="0.7">78%</text>
    <text x="120" y="96" font-size="15" font-weight="600" fill="#fff" text-anchor="middle">Device alerts</text>
    <text x="120" y="120" font-size="12.5" fill="#fff" fill-opacity="0.5" text-anchor="middle">Bluetooth battery &amp; charging</text>
  </g>

  <text x="640" y="318" font-size="13" fill="#fff" fill-opacity="0.35" text-anchor="middle">Hover to expand  ·  Move away to collapse</text>
</svg>
